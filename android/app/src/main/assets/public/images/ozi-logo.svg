<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="oziCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B5B"/>
      <stop offset="100%" stop-color="#FF3829"/>
    </linearGradient>
    <linearGradient id="oziFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C73"/>
      <stop offset="100%" stop-color="#FF4331"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF3829" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- OZI Icon Symbol (Left) -->
  <g transform="translate(10, 10)" filter="url(#glow)">
    <!-- Rounded Background Badge -->
    <rect width="100" height="100" rx="24" fill="url(#oziCoral)"/>
    
    <!-- Outer concentric ring -->
    <circle cx="50" cy="50" r="34" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <!-- Inner concentric ring -->
    <circle cx="50" cy="50" r="19" fill="none" stroke="#FFFFFF" stroke-width="5.5"/>
    <!-- Center comic iris dot -->
    <circle cx="50" cy="50" r="7" fill="#FFFFFF"/>
    
    <!-- Dynamic Lightning Flash Accent -->
    <path d="M72 26 L82 40 L74 42 L80 54 L66 45 L74 43 Z" fill="#FFE27A"/>
  </g>

  <!-- OZI Brand Text (Right) -->
  <g transform="translate(126, 82)">
    <!-- O -->
    <text x="0" y="0" font-family="'Outfit', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="-1">O</text>
    <!-- Z -->
    <text x="56" y="0" font-family="'Outfit', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="url(#oziFlame)" letter-spacing="-1">Z</text>
    <!-- I -->
    <text x="108" y="0" font-family="'Outfit', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="-1">I</text>
    
    <!-- Subtitle: WEBTOONS -->
    <text x="4" y="24" font-family="'Outfit', 'Arial', sans-serif" font-weight="800" font-size="14" fill="#94A3B8" letter-spacing="5">WEBTOONS</text>
  </g>
</svg>
