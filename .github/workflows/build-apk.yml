name: 🚀 Build & Release OZI Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 📱 Compiler l'APK Android OZI
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: ☕ Configurer Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Configurer Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: 🟢 Configurer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Installer les dépendances NPM
        run: |
          npm install --legacy-peer-deps

      - name: 🏗️ Compiler l'application Web (Vite)
        run: |
          npm run build

      - name: 🔄 Synchroniser Capacitor Android
        run: |
          npx cap sync android

      - name: ⚙️ Compiler l'APK Android
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace
          cd ..

      - name: 📤 Exporter l'APK Téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: ozi-webtoon-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
