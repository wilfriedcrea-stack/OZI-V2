name: 🚀 Build & Release OZI Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write

jobs:
  build-apk:
    name: 📱 Compiler l'APK Android OZI
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: ☕ Configurer Java JDK 21 (Requis par Gradle 8.14)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Configurer Node.js 22 (Requis par Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Installer les dépendances
        run: |
          npm install --legacy-peer-deps

      - name: 🏗️ Compiler l'application Web (Vite)
        run: |
          npm run build

      - name: 🔄 Synchroniser Capacitor Android
        run: |
          npx cap sync android

      - name: 🔑 Rendre Gradlew exécutable
        run: |
          chmod +x ./android/gradlew

      - name: ⚙️ Compiler l'APK Android
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..

      - name: 📤 Exporter l'APK Téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: ozi-webtoon-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
